services:
  eureka-server:
    image: jhipster/jhipster-registry
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=eureka-server
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - bank-network
    mem_limit: 256m

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - bank-network
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    ports:
      - "6379:6379"
    networks:
      - bank-network
    volumes:
      - redis-data-bank:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.5.0
    container_name: shared-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=Xms512m -Xms512m
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - bank-network
    volumes:
      - elasticsearch-data-bank:/usr/share/elasticsearch/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - bank-network
    mem_limit: 256m


  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: bank-kafka
    ports: 
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    depends_on: 
      - zookeeper
    networks: 
      - bank-network
    mem_limit: 512m

  auth-db:
    image: postgres:17.2-alpine3.21
    container_name: bank-auth-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth_db
    ports:
      - "5436:5432"
    networks:
      - bank-network
    volumes:
      - db-data-bank-auth:/var/lib/postgresql/data
    mem_limit: 256m

  auth-services:
    build:
      context: ./services/auth-services
      dockerfile: Dockerfile
    container_name: bank-auth-services
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_started
    networks:
      - bank-network
    volumes:
      - app-data-auth:/data
    command: ["./wait-for-it.sh", "db:5432", "--", "java", "-jar", "app.jar"]

  user-db:
    image: postgres:17.2-alpine3.21
    container_name: bank-user-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    networks:
      - bank-network
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 256m

  user-db-couchbase:
    image: couchbase:community-7.1.1
    build:
      context: ./user-db-couchbase
    container_name: bank-user-couchbase
    environment:
      - COUCHBASE_ADMINISTRATOR_USERNAME=${COUCHBASE_USERNAME}
      - COUCHBASE_ADMINISTRATOR_PASSWORD=${COUCHBASE_PASSWORD}
    ports:
      - "8091:8091"
      - "8093:8093"
      - "8094:8094"
      - "11210:11210"
    networks:
      - bank-network
    volumes:
      - user-couchbase-data:/opt/couchbase/var
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8091/pools/default || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    mem_limit: 2000m

  user-service:
    build:
      context: ./user-services
      dockerfile: Dockerfile
    container_name: bank-user-service
    ports:
      - "8084:8084"
    depends_on:
      user-db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - bank-network
    volumes:
      - app-data:/data
    command: ["./wait-for-it.sh", "user-db:5432", "--timeout=300", "--", "./wait-for-it.sh", "user-db-couchbase:8091", "--timeout=300", "--", "java", "-jar", "app.jar"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_COUCHBASE_CONNECTION_STRING: couchbase://user-db-couchbase
      SPRING_COUCHBASE_USERNAME: ${COUCHBASE_USERNAME}
      SPRING_COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD}
      SPRING_COUCHBASE_BUCKET_NAME: user_services_bucket
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    mem_limit: 256m

  location-db:
    image: postgres:17.2-alpine3.21
    container_name: bank-location-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: country_db
    ports:
      - "5434:5432"
    networks:
      - bank-network
    volumes:
      - db-data-country:/var/lib/postgresql/data

  location-orchestrator:
    build:
      context: ./location-orchestrator
      dockerfile: Dockerfile
    container_name: bank-location-service
    ports:
      - "8086:8086"
    depends_on:
      location-db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - bank-network
    volumes:
      - app-data-country:/data
    command: ["./wait-for-it.sh", "location-db:5432", "--", "java", "-jar", "app.jar"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://location-db:5432/country_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_REDIS_HOST: redis

  compliance-db:
    image: postgres:17.2-alpine3.21
    container_name: bank-compliance-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: compliance_db
    ports:
      - "5435:5432"
    networks:
      - bank-network
    volumes:
      - db-data-compliance:/var/lib/postgresql/data

  compliance-service:
    build:
      context: ./compliance-service
      dockerfile: Dockerfile
    container_name: bank-compliance-service
    ports:
      - "8087:8087"
    depends_on:
      compliance-db:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - bank-network
    volumes:
      - app-data-compliance:/data
    command: ["./wait-for-it.sh", "compliance-db:5432", "--", "java", "-jar", "app.jar"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://compliance-db:5432/compliance_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200

networks:
  bank-network:
    driver: bridge

volumes:
  redis-data-bank:
  elasticsearch-data-bank:
  db-data:
  db-data-country:
  db-data-compliance:
  user-couchbase-data:
  app-data:
  app-data-country:
  app-data-compliance:
  db-data-bank-auth:
    external:
      name: auth-services_db-data-bank-auth
  app-data-auth:

